<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AkaDako Python (browser PoC)</title>
  <!-- 699.jp の favicon の複製。外部URL直接参照は COEP(require-corp) にブロックされるため
       同一オリジンで配信する（元: https://699.jp/wp-content/themes/akadako/favicon.ico） -->
  <link rel="icon" href="/favicon.ico" />

  <!-- iPad の Safari/Chrome で開かれたら Scrub で開き直すよう促す。
       iPad の通常ブラウザは Web MIDI が無く AkaDako に接続できないため。
       Chromebook/Windows(Chrome/Edge) や Scrub 内(UAに"Scrub")には影響しない。 -->
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var inScrub = /Scrub/.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (!(isIOS && !inScrub && !navigator.requestMIDIAccess)) return;

      window.__scrubRedirect = true;   // main.js が Pyodide を起動しないための目印
      var SCRUB = "scrub://openUrl/?https://py.699.jp/";

      document.addEventListener("DOMContentLoaded", function () {
        var d = document.createElement("div");
        d.id = "scrub-gate";
        d.innerHTML =
          '<div class="sg-box">' +
          '<h2>iPad では Scrub で開いてください</h2>' +
          '<p>このページは AkaDako と通信するため <b>Scrub アプリ</b>で開く必要があります。' +
          'Safari / Chrome では機器に接続できません。</p>' +
          '<a class="sg-btn" href="' + SCRUB + '">Scrub で開く</a>' +
          '</div>';
        document.body.appendChild(d);
        // Scrub が入っていれば自動で開く（未インストール時はこの画面が残る）。
        setTimeout(function () { location.href = SCRUB; }, 150);
      });
    })();
  </script>

  <!-- CodeMirror 5 (self-hosted, see fetch-vendor.sh; no build step) -->
  <link rel="stylesheet" href="/web/vendor/codemirror/codemirror.min.css" />
  <link rel="stylesheet" href="/web/vendor/codemirror/addon/hint/show-hint.min.css" />
  <script src="/web/vendor/codemirror/codemirror.min.js"></script>
  <script src="/web/vendor/codemirror/mode/python/python.min.js"></script>
  <script src="/web/vendor/codemirror/addon/hint/show-hint.min.js"></script>
  <script src="/web/vendor/codemirror/addon/edit/matchbrackets.min.js"></script>
  <script src="/web/vendor/codemirror/addon/edit/closebrackets.min.js"></script>
  <!-- 共有URL機能: コード圧縮(lz-string) と QRコード生成 -->
  <script src="/web/vendor/lz-string/lz-string.min.js"></script>
  <script src="/web/vendor/qrcode/qrcode.js"></script>

  <style>
    :root {
      color-scheme: light;
      --accent: #1565c0;
      --accent-hover: #1976d2;
      /* AkaDako JavaScript Editor と同じ淡いブルーグレー基調。
         ヘッダーのバーのみ深緑系にして Python 版と見分けが付くようにする。
         コーディング部分 (CodeMirror) は白背景のまま */
      --bg: #d9e4f0;
      --panel: #e9f1f8;
      --border: #b7c9dc;
      --text: #1f2d3d;
      --muted: #5a708a;
      --header-bg: #2d5a45;
      --header-border: #224738;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
    }
    header {
      display: flex; align-items: center; gap: .5rem;
      padding: .5rem .75rem; background: var(--header-bg); border-bottom: 1px solid var(--header-border);
      overflow-x: auto;   /* 入りきらない時の最終手段: 横スクロール */
    }
    header h1 { font-size: 1.15rem; margin: 0 .75rem 0 0; font-weight: 700; flex: none; color: #fff; }
    button {
      font: inherit; font-size: 1rem; padding: .45rem .9rem; border: 1px solid var(--border);
      background: #f7fafd; color: var(--text); border-radius: 6px; cursor: pointer;
      white-space: nowrap;   /* 文字を2行に折り返さない */
    }
    header button {
      flex: none;   /* ボタンを縮めず、つぶれて折り返るのを防ぐ */
      font-size: .875rem; padding: .38rem .65rem;
      background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); color: #fff;
    }
    header button:hover:not(:disabled) { background: rgba(255,255,255,.24); }
    /* 画面が狭い時はボタン自体を一回り小さくして1行に収める */
    @media (max-width: 1200px) {
      header { gap: .3rem; padding: .5rem .5rem; }
      header h1 { font-size: 1rem; margin-right: .4rem; }
      header button { font-size: .8rem; padding: .3rem .5rem; }
      #save, #sample { margin-left: .6rem; }
    }
    /* さらに狭い時はタイトルを隠してボタンを優先（タブ名で分かるため） */
    @media (max-width: 1000px) {
      header h1 { display: none; }
    }
    button:hover:not(:disabled) { background: #e8f0f8; }
    button:disabled { opacity: .45; cursor: default; }
    #run, .primary { background: #1e88e5; border-color: #1e88e5; color: #fff; }
    #run:hover:not(:disabled), .primary:hover:not(:disabled) { background: #2196f3; }
    #stop { color: #ffc4bc; }
    #save { margin-left: .9rem; }   /* 実行系 と 保存系 の区切り */
    #sample { margin-left: .9rem; } /* 保存系 と サンプル の区切り */
    #vibe {
      margin-left: auto;   /* 右端に寄せる（ステータス欄は実行結果エリアへ移設済み） */
      background: linear-gradient(135deg, #7c4dff, #e040fb); color: #fff;
      border: none; font-weight: 600;
    }
    #vibe:hover:not(:disabled) { filter: brightness(1.08); background: linear-gradient(135deg, #7c4dff, #e040fb); }

    main {
      flex: 1; min-height: 0; display: grid;
      /* 各エリアの広さは仕切り(splitter)のドラッグで変更できる（main.js が
         CSS変数を書き換え、localStorage に保存する） */
      grid-template-columns: 1fr 6px var(--panel-w, 340px);
      grid-template-rows: 1fr 6px var(--console-h, 220px);
    }
    #editorwrap { grid-column: 1; grid-row: 1; overflow: hidden; min-height: 0; background: #fff; }
    /* ドラッグで面積を変える仕切り。ダブルクリックで初期配分に戻る */
    .splitter { background: var(--border); touch-action: none; user-select: none; }
    .splitter:hover, .splitter.dragging { background: var(--accent); }
    #hsplit { grid-column: 1; grid-row: 2; cursor: row-resize; }
    #vsplit { grid-column: 2; grid-row: 1 / span 3; cursor: col-resize; }
    .CodeMirror { height: 100%; font-size: 16px; line-height: 1.55; }
    #console-wrap {
      grid-column: 1; grid-row: 3; position: relative; min-height: 0;
      display: flex;
    }
    #console {
      flex: 1; margin: 0; padding: .75rem 5rem .75rem .75rem; overflow: auto;
      white-space: pre-wrap; background: #f4f8fc;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 14px; line-height: 1.5;
    }
    #console .err { color: #c62828; }
    #console .muted { color: #2e7d32; }
    #console .warn { color: #b25e00; }   /* 状態表示の注意・案内（旧ステータス欄のオレンジ） */
    #clear {
      position: absolute; top: .4rem; right: .6rem; z-index: 5;
      font-size: .85rem; padding: .25rem .6rem; opacity: .9;
    }
    #clear:hover { opacity: 1; }

    /* 右パネル: センサーグラフ / リファレンス */
    aside#monitor {
      grid-column: 3; grid-row: 1 / span 3; min-height: 0;
      display: flex; flex-direction: column;
      background: var(--panel);
    }
    #tabs { display: flex; border-bottom: 1px solid var(--border); }
    #tabs .tab {
      flex: 1; font: inherit; font-size: 1rem; padding: .55rem .5rem; margin: 0;
      background: var(--panel); color: var(--muted); border: none; border-bottom: 2px solid transparent;
      border-radius: 0; cursor: pointer;
    }
    #tabs .tab:hover { background: #dbe7f3; }
    #tabs .tab.active { color: var(--accent); background: #cfe3f6; border-bottom-color: var(--accent); font-weight: 600; }
    #watchlist { overflow: auto; padding: .25rem 0; flex: 1; }
    .watch {
      display: grid; grid-template-columns: 1fr auto; align-items: center;
      gap: .25rem .5rem; padding: .45rem .75rem; border-bottom: 1px solid #d5e2ef;
    }
    .watch .name {
      font-size: 14px; color: #33475e;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .watch .val {
      font-family: ui-monospace, Menlo, monospace; font-size: 18px;
      color: #0b6e4f; font-weight: 700; justify-self: end;
    }
    .watch canvas { grid-column: 1 / span 2; width: 100%; height: 30px; }
    #monitor .empty { padding: .75rem; font-size: .95rem; color: var(--muted); line-height: 1.6; }
    #refview { overflow: auto; flex: 1; padding: .25rem .75rem 1rem; }
    #refview[hidden], #watchlist[hidden] { display: none; }
    #refview .rnote { font-size: .85rem; color: var(--muted); margin: .4rem 0 .2rem; line-height: 1.5; }
    #refview h4 { margin: .9rem 0 .25rem; font-size: .9rem; color: var(--accent); }
    #refview .ritem { padding: .35rem 0; border-bottom: 1px solid #d5e2ef; }
    #refview .rsig { display: block; font-family: ui-monospace, Menlo, monospace; font-size: .92rem; color: #6f42c1; }
    #refview .rdoc { font-size: .85rem; color: var(--muted); }
    .cm-errorline { background: rgba(229, 57, 53, 0.16) !important; }
    .cm-debugline { background: rgba(21, 101, 192, 0.16) !important; }
    .breakpoints { width: 1.1em; }
    .cm-bp { color: #e53950; padding-left: 2px; cursor: pointer; }
    #debugbar {
      position: fixed; top: 52px; left: 50%; transform: translateX(-50%); z-index: 40;
      display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; max-width: 92vw;
      padding: .5rem .75rem; background: #fff; border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 6px 24px rgba(20, 40, 70, .22);
    }
    #debugbar[hidden] { display: none; }
    #debugbar #dbg-status { font-size: .95rem; color: var(--text); }
    #debugbar button { font-size: .9rem; padding: .3rem .8rem; }
    #debugbar #dbg-stop { background: #c62828; border-color: #c62828; color: #fff; }
    #dbg-vars {
      font-family: ui-monospace, Menlo, monospace; font-size: .85rem; color: #6f42c1;
      max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .CodeMirror-hints { font-size: 15px; max-height: 22em; z-index: 60; }
    .CodeMirror-hint { padding: .15rem .6rem; }

    /* 保存・読み込み・バイブコーディングのダイアログ */
    .modal[hidden] { display: none; }
    .modal {
      position: fixed; inset: 0; z-index: 50; display: flex;
      align-items: center; justify-content: center; background: rgba(30, 40, 60, .35);
    }
    .modal-box {
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
      min-width: 340px; max-width: 90vw; max-height: 80vh;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.18);
    }
    .modal-box h3 { margin: 0; padding: .8rem 1rem; font-size: 1.1rem; border-bottom: 1px solid var(--border); }
    .modal-body { padding: 1rem; overflow: auto; font-size: 1rem; line-height: 1.7; }
    .modal-body input, .modal-body textarea {
      width: 100%; font: inherit; font-size: 1rem; padding: .5rem;
      background: #fff; color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    }
    .modal-body textarea { resize: vertical; min-height: 5.5em; line-height: 1.5; }
    /* Vibe Coding & Assist のモード切り替え（修正 / ゼロから / エラー相談 / コード相談） */
    .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: .7rem; }
    .seg button {
      border: none; border-radius: 0; padding: .5rem .8rem; background: #fff; color: var(--muted);
      font-size: .9rem; cursor: pointer; border-right: 1px solid var(--border);
    }
    .seg button:last-child { border-right: none; }
    .seg button:hover:not(.active) { background: #eef3f9; }
    .seg button.active { background: var(--accent); color: #fff; font-weight: 600; }
    .seg button:disabled { opacity: .4; cursor: not-allowed; }
    /* バイブコーディングの生成中スピナー */
    .vibe-spinner {
      display: inline-block; width: 1.15em; height: 1.15em; flex: none;
      border: 2px solid #cdd9e6; border-top-color: var(--accent);
      border-radius: 50%; animation: vibe-spin .8s linear infinite;
    }
    @keyframes vibe-spin { to { transform: rotate(360deg); } }
    .vibe-errbox { max-height: 40vh; overflow: auto; line-height: 1.6; }
    .vibe-errbox a { color: var(--accent); }
    /* 相談モードの回答表示 */
    .consult-q { color: var(--muted); font-size: .9rem; margin-bottom: .5rem; white-space: pre-wrap; }
    .consult-a {
      background: #f3f8f3; border: 1px solid var(--border); border-radius: 10px;
      padding: .7rem .9rem; white-space: pre-wrap; line-height: 1.7;
      max-width: 44rem; max-height: 45vh; overflow: auto;
    }
    /* エラー後に出力ペインへ出す「AIに聞く」導線 */
    #console .ask-ai {
      display: inline-block; margin: .3rem 0 .4rem; padding: .3rem .8rem;
      font: inherit; font-size: .9rem; cursor: pointer;
      color: var(--accent); background: #fff;
      border: 1px solid var(--accent); border-radius: 999px;
    }
    #console .ask-ai:hover { background: #eef3f9; }
    .modal-actions { display: flex; justify-content: flex-end; gap: .5rem; padding: .75rem 1rem; border-top: 1px solid var(--border); }
    .prog-row { display: flex; align-items: center; gap: .5rem; padding: .45rem 0; border-bottom: 1px solid #d5e2ef; }
    .prog-row .pname { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 1rem; word-break: break-all; }
    .prog-row button { font-size: .9rem; padding: .3rem .7rem; }

    /* iPad → Scrub 誘導オーバーレイ */
    #scrub-gate {
      position: fixed; inset: 0; z-index: 1000; display: flex;
      align-items: center; justify-content: center; padding: 1.5rem;
      background: var(--bg);
    }
    #scrub-gate .sg-box { max-width: 28rem; text-align: center; }
    #scrub-gate h2 { font-size: 1.3rem; margin: 0 0 1rem; color: var(--accent); }
    #scrub-gate p { font-size: 1.05rem; line-height: 1.7; color: var(--text); margin: 0 0 1.5rem; }
    #scrub-gate .sg-btn {
      display: inline-block; font-size: 1.15rem; font-weight: 600;
      padding: .8rem 2rem; background: var(--accent); color: #fff;
      border-radius: 8px; text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>AkaDako Python</h1>
    <button id="connect" title="ボードに接続">Connect</button>
    <button id="run" disabled title="実行 (Ctrl+Enter)">Run ▶</button>
    <button id="stop" disabled title="停止">Stop ◼</button>
    <button id="debug" disabled title="ステップ実行・ブレークポイント">Debug</button>
    <button id="revert" title="前のコードに戻す（Run や AI での置き換えのたびに自動で控えます）">Undo</button>
    <button id="save" title="保存">Save</button>
    <button id="open" title="開く">Open</button>
    <button id="share" title="共有URLを作成（コードをURLに埋め込みます。サーバーには保存されません）">Share</button>
    <button id="sample" title="接続中のボードに合わせたサンプルコードを作成">Sample</button>
    <button id="vibe" title="Vibe Coding &amp; Assist：生成AIでプログラムを作成・エラーやコードの相談">Vibe/Assist ✨</button>
  </header>
  <main>
    <div id="editorwrap"><textarea id="editor" spellcheck="false"></textarea></div>
    <div id="hsplit" class="splitter" title="ドラッグで広さを変更（ダブルクリックで元に戻す）"></div>
    <div id="console-wrap">
      <button id="clear">クリア</button>
      <pre id="console"></pre>
    </div>
    <div id="vsplit" class="splitter" title="ドラッグで広さを変更（ダブルクリックで元に戻す）"></div>
    <aside id="monitor">
      <div id="tabs">
        <button id="tab-sensor" class="tab active">センサー</button>
        <button id="tab-ref" class="tab">リファレンス</button>
      </div>
      <div id="watchlist"><div class="empty">「Connect」でボードに接続すると、接続されているセンサーを自動で探して、見つかったセンサーをすべてここにグラフ表示します。プログラム実行中は、読み取った値や monitor() の値が表示されます。</div></div>
      <div id="refview" hidden></div>
    </aside>
  </main>
  <div id="debugbar" hidden>
    <span id="dbg-status">⏸ 停止中</span>
    <button id="dbg-step">次へ</button>
    <button id="dbg-continue">続行</button>
    <button id="dbg-stop">停止</button>
    <span id="dbg-vars"></span>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>
  <script src="/web/akadako-api.js"></script>
  <script src="/web/main.js"></script>
</body>
</html>
